[package]
name = "de-server"
description = "Local engine server: WebSocket API, project save file, web UI hosting"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
de-core.workspace = true
de-solid.workspace = true
de-intent.workspace = true
de-shape.workspace = true
de-assembly.workspace = true
de-sourcing.workspace = true
de-pcb.workspace = true
de-occt.workspace = true
sha2 = "0.10"
tokio-tungstenite = "0.29"
getrandom = "0.3"
base64 = "0.22"
manifold-csg = "0.4"
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "process", "io-util", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

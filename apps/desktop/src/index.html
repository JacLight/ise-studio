<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iṣẹ́ Studio</title>
    <style>
      :root {
        --bg: #fafbfc;
        --ink: #1d1b26;
        --muted: #6b6880;
        --line: #e6e4ee;
        --accent: #7352d6;
        --panel: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15141b;
          --ink: #ecebf3;
          --muted: #9a97ad;
          --line: #2c2a36;
          --accent: #9b80f5;
          --panel: #1d1c25;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        /* Helvetica Neue sets the accent of ẹ́ over its letter; the system UI font shifts it. */
        font: 14px/1.5 "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main { display: grid; justify-items: center; gap: 14px; width: min(560px, calc(100vw - 32px)); text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      #status { margin: 0; color: var(--muted); min-height: 21px; }
      .bar { width: 160px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: 0.5; } }
      #problem { display: none; width: 100%; text-align: left; }
      pre {
        margin: 0 0 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
        cursor: text;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 7px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      body.problem .bar { display: none; }
      body.problem #problem { display: block; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>Iṣẹ́ Studio</h1>
      <p id="status">Looking for the engine…</p>
      <div class="bar" aria-hidden="true"></div>
      <div id="problem">
        <pre id="detail"></pre>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      // The app reports here while it reaches the engine (see src-tauri/src/main.rs).
      window.iseStatus = (text, problem) => {
        document.body.classList.toggle("problem", problem);
        if (problem) {
          document.getElementById("status").textContent = "The engine isn't running.";
          document.getElementById("detail").textContent = text;
        } else {
          document.getElementById("status").textContent = text;
        }
      };
    </script>
  </body>
</html>

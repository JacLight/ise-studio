[workspace]
resolver = "3"
members = ["crates/core", "crates/plugins/solid", "crates/plugins/intent", "crates/plugins/shape", "crates/plugins/assembly", "crates/plugins/draft", "crates/plugins/sourcing", "crates/plugins/pcb", "crates/plugins/bim", "crates/plugins/scan", "crates/occt", "crates/server", "crates/bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
de-core = { path = "crates/core" }
de-solid = { path = "crates/plugins/solid" }
de-intent = { path = "crates/plugins/intent" }
de-shape = { path = "crates/plugins/shape" }
de-assembly = { path = "crates/plugins/assembly" }
de-draft = { path = "crates/plugins/draft" }
de-sourcing = { path = "crates/plugins/sourcing" }
de-pcb = { path = "crates/plugins/pcb" }
de-bim = { path = "crates/plugins/bim" }
de-occt = { path = "crates/occt" }
de-scan = { path = "crates/plugins/scan" }
bevy_ecs = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
uuid = { version = "1", features = ["v7", "serde"] }
rayon = "1"
rustc-hash = "2"
smallvec = "1"

[profile.release]
lto = "thin"
